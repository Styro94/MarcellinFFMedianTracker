name: Update Median Tracker

on:
  schedule:
    # Runs every 5 minutes, all day Sunday (day 0) and Monday (day 1) UTC.
    # NFL games span multiple US timezones so this errs on the wide side;
    # it's cheap to run and does nothing harmful if there's no live game.
    # Note: GitHub doesn't guarantee exact timing for scheduled workflows,
    # especially during peak load (like NFL Sundays) - runs may occasionally
    # be a few minutes late, but this won't affect correctness.
    - cron: "*/5 * * * 0,1"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          YEAR: ${{ secrets.YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python update_median.py

      - name: Commit and push updated page
        run: |
          git config user.name "median-tracker-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Update median tracker"
          git push
