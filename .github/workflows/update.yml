name: Update Median Tracker

on:
  schedule:
    # GitHub throttles frequent cron schedules (a "*/5" schedule was only
    # firing every 3-4 hours on game days). So instead of triggering a run
    # every 5 minutes, we trigger ONE long run and let it loop internally,
    # updating the page every 5 minutes for up to ~5.5 hours.
    # Hourly triggers keep a loop going all day; the "concurrency" setting
    # below makes sure only one runs at a time (extras wait in line).
    # Cron times are UTC. Pacific is 7-8 hours behind, so Monday Night
    # Football (evening Monday Pacific) falls on Tuesday UTC.
    - cron: "17 * * * 0"        # all day Sunday UTC
    - cron: "17 * * * 1"        # all day Monday UTC
    - cron: "17 0-13 * * 2"     # Tuesday UTC morning (Monday night games, Pacific)
    - cron: "17 16 * * 3"       # Wednesday: one refresh to show the new week

  workflow_dispatch: {}   # manual "Run workflow" button (starts a loop too)

permissions:
  contents: write

concurrency:
  group: median-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update page (loops every 5 minutes on game days)
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          YEAR: ${{ secrets.YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          # Loop on game-day scheduled runs AND manual runs. Only the
          # Wednesday refresh does a single update and finishes.
          IS_LOOP: ${{ github.event.schedule != '17 16 * * 3' }}
        run: |
          git config user.name "median-tracker-bot"
          git config user.email "actions@github.com"

          ITERATIONS=1
          if [ "$IS_LOOP" = "true" ]; then ITERATIONS=66; fi

          FAILED=0
          for i in $(seq 1 $ITERATIONS); do
            python update_median.py || FAILED=1
            git add index.html
            git diff --quiet --cached || git commit -m "Update median tracker"
            git pull --rebase -q && git push -q || FAILED=1

            # Stop looping once Tuesday afternoon UTC arrives (games are over)
            if [ "$(date -u +%u)" = "2" ] && [ "$(date -u +%H)" -ge 14 ]; then
              break
            fi

            if [ "$i" -lt "$ITERATIONS" ]; then sleep 300; fi
          done
          exit $FAILED
