name: Update Median Tracker

on:
  schedule:
    # NFL games run all day Sunday and Monday evening, Pacific Time.
    # Cron schedules run in UTC, and Pacific is 7-8 hours behind UTC
    # (depending on daylight saving), so "Sunday/Monday Pacific" actually
    # spans FOUR different UTC calendar days: it starts Saturday evening
    # UTC and, because Monday Night Football kicks off around 5pm Pacific
    # (which is already Tuesday morning in UTC), doesn't finish until
    # Tuesday morning UTC. The four lines below cover that whole window:
    #   - Sat 17:00-23:59 UTC  -> covers the very start of Sunday 00:00 Pacific
    #   - all day Sunday UTC   -> covers Sunday daytime/evening Pacific
    #   - all day Monday UTC   -> covers Sunday night through Monday daytime Pacific
    #   - Tue 00:00-13:00 UTC  -> covers Monday Night Football through ~5-6am Pacific
    # This is intentionally a bit wider than necessary so it works correctly
    # whether it's Pacific Daylight Time or Pacific Standard Time - a few
    # extra cheap 5-minute runs on the edges is not a problem.
    - cron: "*/5 17-23 * * 6"
    - cron: "*/5 * * * 0"
    - cron: "*/5 * * * 1"
    - cron: "*/5 0-13 * * 2"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          YEAR: ${{ secrets.YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python update_median.py

      - name: Commit and push updated page
        run: |
          git config user.name "median-tracker-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Update median tracker"
          git push
